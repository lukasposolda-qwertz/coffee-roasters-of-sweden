<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kafferosterier i Sverige</title>
<meta name="description" content="Karta över alla kafferosterier i Sverige som finns i OpenStreetMap. A map of every coffee roaster in Sweden in OpenStreetMap.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23A9B795'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<div id="app">
  <aside id="panel">
    <button id="sheetHandle" type="button" data-i18n-aria="sheet"></button>
    <header class="head">
      <div class="topline">
        <h1 data-i18n-html="title"></h1>
        <button type="button" class="linkbtn" id="langBtn"></button>
      </div>
      <p class="lead" data-i18n="lead"></p>
      <div class="stats" aria-live="polite">
        <div><span class="n" id="count">–</span><span class="label" id="countLabel"></span></div>
        <div><span class="n open" id="openCount">–</span><span class="label" data-i18n="openNow"></span></div>
        <button type="button" id="townStat" data-i18n-aria="showTowns"><span class="n" id="townCount">–</span><span class="label" data-i18n="townsArrow"></span></button>
      </div>
    </header>
    <div class="controls">
      <input id="q" type="search" autocomplete="off" data-i18n-ph="search" data-i18n-aria="searchAria">
      <div class="tags" role="group" data-i18n-aria="filters">
        <button type="button" class="tag" id="fOpen" aria-pressed="false"><span data-i18n="fOpen"></span> <span class="n"></span></button>
        <button type="button" class="tag" id="fHours" aria-pressed="false"><span data-i18n="fHours"></span> <span class="n"></span></button>
        <button type="button" class="tag" id="townChip" aria-pressed="true" hidden></button>
      </div>
      <div class="views" role="tablist" data-i18n-aria="view">
        <button type="button" role="tab" id="vList" aria-selected="true" aria-controls="list" data-i18n="vList"></button>
        <button type="button" role="tab" id="vTowns" aria-selected="false" aria-controls="towns" data-i18n="vTowns"></button>
      </div>
      <div class="sortrow">
        <label class="label" for="sort" data-i18n="sort"></label>
        <select id="sort"><option value="name" data-i18n="sortName"></option><option value="near" data-i18n="sortNear"></option><option value="view" data-i18n="sortView"></option></select>
      </div>
    </div>
    <ul id="list" role="tabpanel"></ul>
    <ol id="towns" role="tabpanel" hidden></ol>
    <div class="panelfoot"><button type="button" class="linkbtn" id="aboutBtn" aria-expanded="false" aria-controls="about" data-i18n="aboutBtn"></button></div>
    <div id="about" class="about" hidden>
      <section>
        <span class="label" data-i18n="aWhatH"></span>
        <p data-i18n="aWhat"></p>
        <ul class="legend">
          <li><span class="dot s1"></span><span data-i18n="legRoastery"></span></li>
          <li><span class="dot s2"></span><span data-i18n="legCafe"></span></li>
        </ul>
      </section>
      <section>
        <span class="label" data-i18n="aHoursH"></span>
        <p data-i18n="aHours"></p>
      </section>
      <section>
        <span class="label" data-i18n="aMissingH"></span>
        <p data-i18n-html="aMissing"></p>
      </section>
      <section>
        <span class="label" data-i18n="aDataH"></span>
        <p data-i18n-html="aData"></p>
        <span class="figure" id="snap"></span>
        <p id="tilesNote" hidden data-i18n="tilesNote"></p>
      </section>
      <section>
        <span class="label" data-i18n="aCreditsH"></span>
        <p data-i18n-html="aCredits"></p>
        <p data-i18n-html="aBy"></p>
      </section>
      <button type="button" class="btn-back linkbtn back" id="aboutBack" data-i18n="back"></button>
    </div>
  </aside>
  <div id="map" role="region" data-i18n-aria="mapAria"></div>
</div>
<!--/APP-->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
